name: Daily class action data refresh

on:
  schedule:
    # Every 6 hours (09:00, 15:00, 21:00, 03:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape trackers
        run: python scrape.py

      - name: Commit updated data
        run: |
          git config user.name "class-action-bot"
          git config user.email "class-action-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Daily data refresh $(date -u +%F)"
          git pull --rebase
          git push
